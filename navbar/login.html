<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.login.title">EMSafe | Sign in</title>
    <meta name="description" content="Sign in to your EMSafe account." data-i18n-attr="content:meta.login.description">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login-styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-lang">
                <div class="lang-switch lang-switch--light" role="group" aria-label="Language" data-i18n-attr="aria-label:nav.language">
                    <button type="button" class="lang-option" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
                    <button type="button" class="lang-option" data-lang="es" lang="es" aria-label="Español" aria-pressed="false">ES</button>
                </div>
            </div>
            <div class="login-header">
                <img src="../imgs/emsafe-logo-black.png" alt="EMSafe Logo" class="login-logo">
                <h1 class="login-title">EMSafe</h1>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username" data-i18n="login.username">Username</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="login.password">Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="cta-button login-button" data-i18n="login.submit">Sign in</button>
            </form>
            <p class="login-error" id="login-error"></p>
            <div class="login-options">
                <a href="#" class="forgot-password" data-i18n="login.forgot">Forgot your password?</a>
                <a href="#" class="create-account" data-i18n="login.createAccount">Create account</a>
            </div>
        </div>
    </div>
    <script src="../scripts/i18n.js"></script>
    <script src="../scripts/login-scripts.js"></script>
</body>
</html>
